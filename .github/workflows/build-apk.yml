name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK File
      run: cp app/build/outputs/apk/debug/app-debug.apk DuBaoThoiTiet.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuBaoThoiTiet-Debug-APK
        path: DuBaoThoiTiet.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v2.2
        name: "Bản Cập Nhật v2.2 - DuBaoThoiTiet APK (Hoàn Thiện Tương Phản Sáng/Tối & Tra Cứu TP.HCM)"
        overwrite: true
        body: |
          ### 📱 Ứng Dụng Dự Báo Thời Tiết Android - Bản v2.2 (Mới Nhất)
          
          #### 📥 Hướng dẫn tải về điện thoại:
          1. Bấm vào file **`DuBaoThoiTiet.apk`** ở mục **Assets** bên dưới hoặc quét mã QR để tải trực tiếp về điện thoại Android.
          2. Mở file APK trên điện thoại và chọn **Cài đặt**.
          
          #### ✨ Các điểm nâng cấp cốt lõi trong bản v2.2:
          - 🌗 **Tương phản chuẩn xác Sáng / Tối:** Nền trắng chữ màu đen tuyệt đối; Nền tối chữ màu trắng sáng rõ nét, không còn hiện tượng chữ đen trên nền tối hay chữ trắng trên nền trắng.
          - 🏙️ **Hỗ trợ đầy đủ từ viết tắt TP.HCM / Sài Gòn:** Tìm kiếm `TP.HCM`, `TP. HCM`, `TPHCM`, `tp hcm`, `tphcm`, `saigon`, `sg` ra ngay thời tiết TP. Hồ Chí Minh chính xác và hiển thị đẹp.
          - 🛰️ **Giữ nguyên định vị vị trí GPS chuẩn:** Tự động bắt tọa độ thực tế và nhận diện chính xác khu vực.
        files: DuBaoThoiTiet.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
