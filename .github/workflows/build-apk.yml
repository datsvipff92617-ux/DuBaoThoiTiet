name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK File
      run: cp app/build/outputs/apk/debug/app-debug.apk DuBaoThoiTiet.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuBaoThoiTiet-Debug-APK
        path: DuBaoThoiTiet.apk

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v2.1
        name: "Bản Cập Nhật v2.1 - DuBaoThoiTiet APK (Chữ Đen Tương Phản Sắc Nét)"
        overwrite: true
        body: |
          ### 📱 Ứng Dụng Dự Báo Thời Tiết Android - Bản v2.1 (Mới Nhất)
          
          #### 📥 Hướng dẫn tải về điện thoại:
          1. Bấm vào file **`DuBaoThoiTiet.apk`** ở mục **Assets** bên dưới để tải trực tiếp về điện thoại Android.
          2. Mở file APK trên điện thoại và chọn **Cài đặt**.
          
          #### ✨ Các điểm nâng cấp cốt lõi trong bản v2.1:
          - 🖤 **Khắc phục 100% màu chữ trên ô nhập liệu:** Đảm bảo toàn bộ chữ gõ và gợi ý tại màn hình Đăng ký, Đăng nhập, Hồ sơ, Tìm kiếm luôn là màu đen/xám đậm tương phản tuyệt đối trên nền trắng.
          - 🛰️ **Định vị GPS thông minh:** Tự động nhận diện chính xác khu vực người dùng đang ở (thôn/xã, quận/huyện, tỉnh/thành). Hoạt động chuẩn xác trên cả điện thoại thật và máy ảo.
          - 🌗 **Chế độ Sáng / Tối (Dark / Light Theme):** Chuyển đổi giao diện đồng bộ tức thì trên toàn bộ 16 màn hình.
        files: DuBaoThoiTiet.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
